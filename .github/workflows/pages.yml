name: Publish phone app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version (same number as the Windows build of this commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(date -u +%Y-%m-%d); n=""
          for i in 1 2 3 4 5 6; do
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --commit "$GITHUB_SHA" -L 1 --json number -q '.[0].number' 2>/dev/null || true)
            [ -n "$n" ] && break; sleep 10
          done
          if [ -n "$n" ]; then v="1.0.$n"; else v="web $d ($(git rev-parse --short HEAD))"; fi
          printf "window.SS_VERSION = { version: '%s', date: '%s' };\n" "$v" "$d" > docs/version.js
          cat docs/version.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
